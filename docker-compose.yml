services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasks
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tasks']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tasks?schema=public
      JWT_SECRET: 8ade0785df77b77693099e0ed265258a
      JWT_TOKEN_AUDIENCE: app-tasks-api
      JWT_TOKEN_ISSUER: app-tasks-auth
      JWT_TTL: 30d
    volumes:
      - ./files:/app/files
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
